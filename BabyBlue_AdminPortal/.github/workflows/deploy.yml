name: Deploy

# Pipeline: push to main → DEV (automatic) → UAT (manual approval) → PROD (manual approval).
#
# GitHub Actions owns all deploys via the Vercel CLI; the Vercel Git
# integration must stay DISCONNECTED or it will bypass these gates.
#
# - DEV/UAT share one build and one Supabase project. UAT is not a rebuild:
#   the exact DEV deployment is re-aliased, so UAT signs off on the
#   byte-identical artifact.
# - PROD builds separately because its NEXT_PUBLIC_* values (prod Supabase)
#   are inlined at build time — same commit and lockfile, different env.
# - Unlike the patient app, the portal needs SUPABASE_SERVICE_ROLE_KEY at
#   RUNTIME (signed document URLs, export, guarded delete, ingest). It is a
#   server-only secret and is supplied via `vercel deploy --env`, never
#   inlined into the browser bundle.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so a newer push can't re-alias DEV/UAT underneath a
# release that is still waiting on approval.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  DEV_ALIAS: clinic-os-portal-dev.vercel.app
  UAT_ALIAS: clinic-os-portal-uat.vercel.app
  VERCEL_SCOPE: thabomollos-projects

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://clinic-os-portal-dev.vercel.app
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require VERCEL_TOKEN
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create a token at https://vercel.com/account/settings/tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build (dev environment values)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: vercel build --token="$VERCEL_TOKEN"

      # --env supplies RUNTIME env for server-rendered routes; NEXT_PUBLIC_*
      # inlining at build only covers the browser bundle. The service-role key
      # is runtime-only. This keeps GitHub as the single source of env truth.
      - name: Deploy preview artifact
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --env SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Alias to DEV
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "$DEV_ALIAS" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

  smoke-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Smoke test DEV alias
        run: node scripts/smoke.mjs "https://${{ env.DEV_ALIAS }}"

  deploy-uat:
    # Approval gate: the `uat` environment requires a reviewer.
    needs: [deploy-dev, smoke-dev]
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: https://clinic-os-portal-uat.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - run: npm i -g vercel@latest

      - name: Promote the identical DEV artifact to UAT (alias flip, no rebuild)
        run: vercel alias set "${{ needs.deploy-dev.outputs.deployment-url }}" "$UAT_ALIAS" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

  deploy-prod:
    # Approval gate: the `production` environment requires a reviewer.
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://clinic-os-portal.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require production environment configuration
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "::error::production environment has no NEXT_PUBLIC_SUPABASE_URL configured — refusing to ship a build pointed at the wrong backend"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (production environment values)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: |
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --env NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --env SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
